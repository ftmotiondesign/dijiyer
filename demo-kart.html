<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>DijiyeSor İşletme Kartı</title>
<link rel="icon" type="image/png" href="assets/brand/diji-favicon.png">
<style>
:root{--b:#1677ff;--text:#172033;--muted:#667085;--line:#e1e7ef;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:680px;margin:auto;padding:18px}.brand{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px;gap:12px}.brand-left{display:flex;align-items:center;gap:10px;font-weight:900;min-width:0}.top-firm-logo{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain;padding:4px;display:none}.mark{width:40px;height:40px;border-radius:13px;background:var(--b);color:#fff;display:grid;place-items:center;font-size:23px}.top-firm-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.demo{font-size:11px;font-weight:900;background:#fff1d6;color:#9a6700;padding:7px 9px;border-radius:999px;flex:0 0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 50px rgba(30,50,90,.08)}
.cover{height:190px;background:linear-gradient(135deg,#0f5fc9,#28a0ff);background-size:cover;background-position:center;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.35))}.hero{padding:0 26px 26px;text-align:center;background:#fff}.logo{width:96px;height:96px;border-radius:24px;background:#fff;border:4px solid #fff;object-fit:contain;padding:7px;display:none;margin:-48px auto 14px;position:relative;z-index:2;box-shadow:0 8px 25px rgba(0,0,0,.12)}.hero h1{margin:0;font-size:28px}.cat{display:inline-block;margin-top:8px;background:#eef4ff;color:#155db8;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.slogan{font-weight:800;margin-top:12px;color:#344054}.desc{color:var(--muted);line-height:1.55;margin:8px auto 0;max-width:520px}.services{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}.services span{font-size:11px;font-weight:800;background:#f3f6fa;border:1px solid #e2e8f0;padding:7px 9px;border-radius:999px}
.actions{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:11px}.a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff;font-weight:800}.a span{font-size:20px}.a.primary{background:var(--b);color:#fff;border-color:var(--b)}.a.premium{background:#fffaf0;border-color:#f3d9a4}.tag{margin-left:auto;font-size:9px;background:#fef0c7;color:#93370d;padding:4px 6px;border-radius:999px}.section-title{padding:4px 20px 0;font-size:13px;font-weight:900;color:#344054}.gallery{padding:12px 18px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:1.25/1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.info{padding:0 20px 22px}.info div{padding:12px 0;border-top:1px solid #edf1f5}.info small{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:3px}.footer{text-align:center;color:#98a2b3;font-size:12px;padding:18px}
.empty{padding:50px 24px;text-align:center}.hidden{display:none!important}
@media(max-width:520px){.wrap{padding:10px}.actions{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body><main class="wrap">
<div class="brand"><div class="brand-left"><img id="topFirmLogo" class="top-firm-logo"><span id="topFallbackMark" class="mark">F</span><span id="topFirmName" class="top-firm-name">İşletme</span></div><span class="demo">ÖRNEK KART</span></div>
<section id="card" class="card hidden">
<div id="cover" class="cover"></div>
<div class="hero"><img id="logo" class="logo"><h1 id="name"></h1><div id="category" class="cat"></div><div id="slogan" class="slogan"></div><p id="description" class="desc"></p><div id="services" class="services"></div></div>
<div id="actions" class="actions"></div>
<div id="galleryTitle" class="section-title hidden">Fotoğraflar</div><div id="gallery" class="gallery hidden"></div>
<div class="info"><div id="hoursWrap"><small>ÇALIŞMA SAATLERİ</small><span id="hours"></span></div><div id="addressWrap"><small>ADRES</small><span id="address"></span></div><div id="phoneWrap"><small>TELEFON</small><span id="phone"></span></div></div>
</section>
<section id="loading" class="card empty">Demo firma bilgisi yükleniyor...</section>
<div class="footer">DijiyeSor altyapısıyla hazırlanmıştır</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyD4SHYRiuSuHB-wSl8oWUFMCsfVu6j164E",authDomain:"dijiyer.firebaseapp.com",projectId:"dijiyer",storageBucket:"dijiyer.firebasestorage.app",messagingSenderId:"847787778815",appId:"1:847787778815:web:57058aa8dcc4143ec5a2ca"};
const app=firebase.apps.find(a=>a.name==="demoCardPublic")||firebase.initializeApp(firebaseConfig,"demoCardPublic"),db=app.firestore(),$=id=>document.getElementById(id);
function cleanPhone(s){return String(s||"").replace(/\D/g,"")} function add(label,icon,url,cls="",premium=false){if(!url)return;const a=document.createElement("a");a.className="a "+cls;a.href=url;a.target="_blank";a.rel="noopener";a.innerHTML="<span>"+icon+"</span><b>"+label+"</b>"+(premium?'<i class="tag">ÖZEL</i>':"");$("actions").appendChild(a)}
function wa(v){let p=cleanPhone(v);if(p.startsWith("0"))p="90"+p.slice(1);return p?"https://wa.me/"+p:""}
function tel(v){const p=cleanPhone(v);return p?"tel:+"+(p.startsWith("90")?p:"90"+p.replace(/^0/,"")):""}
function escV(v){return String(v||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}
function vcardText(d){return ["BEGIN:VCARD","VERSION:3.0","FN:"+escV(d.name),"ORG:"+escV(d.name),"TEL;TYPE=WORK,VOICE:"+escV(d.phone),"TEL;TYPE=CELL:"+escV(d.whatsapp||d.phone),"EMAIL;TYPE=WORK:"+escV(d.emailContact),"ADR;TYPE=WORK:;;"+escV(d.address),"URL:"+escV(d.website),"NOTE:"+escV("DijiyeSor üzerinden kaydedildi"),"END:VCARD"].filter(Boolean).join("\r\n")}
function addContactButton(d){if(!d.phone&&!d.whatsapp)return;const btn=document.createElement("button");btn.className="a premium";btn.style.cursor="pointer";btn.style.font="inherit";btn.innerHTML='<span>👤</span><b>Rehbere Kaydet</b><i class="tag">ÖZEL</i>';btn.onclick=()=>{const blob=new Blob([vcardText(d)],{type:"text/vcard;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=(d.name||"dijiyesor-kisi").replace(/[^a-z0-9çğıöşüÇĞİÖŞÜ _-]/gi,"").trim().replace(/\s+/g,"-")+".vcf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)};$("actions").appendChild(btn)}
(async()=>{try{const s=await db.collection("siteSettings").doc("home").get(),d=(s.data()||{}).demoCard;if(!d||!d.name)throw new Error("Demo firma henüz seçilmedi.");
$("name").textContent=d.name;$("topFirmName").textContent=d.name;$("category").textContent=d.category||"İşletme";$("slogan").textContent=d.slogan||"";$("description").textContent=d.description||"";$("address").textContent=d.address||"-";$("phone").textContent=d.phone||"-";$("hours").textContent=d.hours||"Belirtilmedi";
if(d.cover)$("cover").style.backgroundImage='linear-gradient(180deg,transparent 35%,rgba(0,0,0,.35)),url("'+d.cover.replace(/"/g,"%22")+'")';
(d.services||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,8).forEach(s=>{const el=document.createElement("span");el.textContent=s;$("services").appendChild(el)});
if(d.logo){$("logo").src=d.logo;$("logo").style.display="block";$("topFirmLogo").src=d.logo;$("topFirmLogo").style.display="block";$("topFallbackMark").style.display="none"}else{$("topFallbackMark").textContent=(d.name||"F").trim().charAt(0).toLocaleUpperCase("tr-TR")}
add("Ara","☎",tel(d.phone),"primary");add("WhatsApp","💬",wa(d.whatsapp||d.phone),"primary");add("Yol Tarifi","📍",d.maps);add("Instagram","◎",d.instagram);add("Web Sitesi","🌐",d.website);add("Facebook","f",d.facebook);add("TikTok","♪",d.tiktok);add("YouTube","▶",d.youtube);
if(d.showReview)add("Google Yorum Yap","★",d.review,"premium",true);
if(d.showContact)addContactButton(d);
if(d.showCampaign)add("Kampanyayı Gör","🎁",d.campaign,"premium",true);
if(d.showRoute)add("Konum Videosu","▶",d.routeVideo,"premium",true);
if(d.show360)add("360° Mekanı Gez","360°",d.tour360,"premium",true);
if(d.showPromo)add("Tanıtım Videosu","🎬",d.promoVideo,"premium",true);
if(d.showInfoRequest)add("Bilgi Al","✉",wa(d.whatsapp||d.phone)+"?text="+encodeURIComponent("Merhaba, DijiyeSor profiliniz üzerinden bilgi almak istiyorum."),"premium",true);
if(d.showGallery&&d.gallery){const urls=d.gallery.split(",").map(x=>x.trim()).filter(Boolean).slice(0,6);if(urls.length){$("galleryTitle").classList.remove("hidden");$("gallery").classList.remove("hidden");urls.forEach(u=>{const im=document.createElement("img");im.src=u;im.loading="lazy";im.alt=d.name+" fotoğrafı";$("gallery").appendChild(im)})}}
if(navigator.share){const b=document.createElement("button");b.className="a";b.style.cursor="pointer";b.style.font="inherit";b.innerHTML="<span>↗</span><b>Paylaş</b>";b.onclick=()=>navigator.share({title:d.name,text:d.description||d.name,url:location.href});$("actions").appendChild(b)}
$("loading").classList.add("hidden");$("card").classList.remove("hidden");document.title=d.name+" | DijiyeSor";
}catch(e){$("loading").textContent=e.message}})();
</script></body></html>
