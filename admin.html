<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dijiyer Admin Paneli</title>

  <link rel="stylesheet" href="admin.css?v=10">
</head>

<body>

  <div class="admin-page">

    <header class="admin-header">
      <div>
        <h1>Dijiyer</h1>
        <p>Yönetim Paneli</p>
      </div>

      <a href="index.html">Siteye Dön</a>
    </header>


    <!-- GİRİŞ ALANI -->

    <section id="loginSection" class="admin-card">

      <h2>Yönetici Girişi</h2>

      <form id="adminLoginForm">

        <label>
          E-posta
          <input
            type="email"
            id="adminEmail"
            placeholder="E-posta adresiniz"
            required
          >
        </label>

        <label>
          Şifre
          <input
            type="password"
            id="adminPassword"
            placeholder="Şifreniz"
            required
          >
        </label>

        <button type="submit">
          Giriş Yap
        </button>

      </form>

      <p id="loginMessage"></p>

    </section>


    <!-- ADMIN PANELİ -->

    <section id="dashboardSection" hidden>

      <div class="dashboard-title">
        <div>
          <h2>Yönetim Paneli</h2>
          <p>Kurum başvurularını ve yayındaki kurumları yönetin.</p>
        </div>

        <button id="logoutBtn">Çıkış Yap</button>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" id="applicationsTabBtn">Kurum Başvuruları</button>
        <button class="admin-tab" id="institutionsTabBtn">Kurumları Yönet</button>
        <button class="admin-tab" id="quotesTabBtn">Teklif Talepleri</button>
      </div>

      <section id="applicationsSection">
        <div class="section-title">
          <h3>Kurum Başvuruları</h3>
          <p id="applicationCount">Başvurular yükleniyor...</p>
        </div>

        <div id="applicationsList"></div>
      </section>

      <section id="institutionsSection" hidden>
        <div class="section-title">
          <h3>Yayındaki Kurumlar</h3>
          <p id="institutionCount">Kurumlar yükleniyor...</p>
        </div>

        <div class="institution-toolbar">
          <div class="toolbar-search">
            <span>⌕</span>
            <input
              type="search"
              id="institutionSearch"
              placeholder="Kurum adı, şehir, ilçe, telefon veya adres ara..."
            >
          </div>

          <select id="institutionCategoryFilter">
            <option value="">Tüm kategoriler</option>
            <option value="surucu">Sürücü Kursu</option>
            <option value="kres">Kreş & Anaokulu</option>
            <option value="yurt">Öğrenci Yurdu</option>
            <option value="esnaf">Yerel Esnaf</option>
            <option value="diger">Diğer</option>
          </select>

          <select id="institutionCityFilter">
            <option value="">Tüm şehirler</option>
          </select>

          <select id="institutionFeatureFilter">
            <option value="">Tüm özellikler</option>
            <option value="vip">Sadece VIP</option>
            <option value="video">Sadece videolu</option>
            <option value="offer">Teklif verenler</option>
          </select>

          <select id="institutionSort">
            <option value="name">Ada göre A-Z</option>
            <option value="city">Şehre göre</option>
            <option value="newest">En yeni</option>
          </select>

          <button type="button" id="clearInstitutionFilters">Filtreleri Temizle</button>
        </div>

        <div class="toolbar-result" id="institutionFilterResult"></div>

        <div id="institutionsList"></div>
      </section>

      <section id="quotesSection" hidden>
        <div class="section-title">
          <h3>Teklif Talepleri</h3>
          <p id="quoteRequestCount">Talepler yükleniyor...</p>
        </div>

        <div class="quote-toolbar">
          <input
            type="search"
            id="quoteRequestSearch"
            placeholder="Müşteri, telefon, şehir, ilçe veya hizmet ara..."
          >

          <select id="quoteStatusFilter">
            <option value="">Tüm durumlar</option>
            <option value="new">Yeni</option>
            <option value="sent">İletildi</option>
            <option value="done">Sonuçlandı</option>
          </select>
        </div>

        <div id="quoteRequestsList"></div>
      </section>

    </section>

  </div>


  <div class="admin-modal hidden" id="institutionEditModal">
    <div class="admin-modal-card">
      <button class="modal-close" id="closeInstitutionEditModal">×</button>
      <h2>Kurum Düzenle</h2>

      <form id="institutionEditForm">
        <input type="hidden" id="editInstitutionId">

        <label>Kurum Adı
          <input type="text" id="editName" required>
        </label>

        <label>Kategori
          <select id="editCategory" required>
            <option value="surucu">Sürücü Kursu</option>
            <option value="kres">Kreş & Anaokulu</option>
            <option value="yurt">Öğrenci Yurdu</option>
            <option value="esnaf">Yerel Esnaf</option>
            <option value="diger">Diğer</option>
          </select>
        </label>

        <div class="form-grid">
          <label>Şehir
            <input type="text" id="editCity">
          </label>

          <label>İlçe
            <input type="text" id="editDistrict">
          </label>
        </div>

        <label>Adres
          <textarea id="editAddress" rows="3"></textarea>
        </label>

        <div class="form-grid">
          <label>Telefon / WhatsApp
            <input type="text" id="editPhone">
          </label>

          <label>Web / Instagram
            <input type="text" id="editWebsite">
          </label>
        </div>

        <div class="form-grid">
          <label>Enlem (lat)
            <input type="number" step="any" id="editLat">
          </label>

          <label>Boylam (lng)
            <input type="number" step="any" id="editLng">
          </label>
        </div>

        <div class="check-grid">
          <label><input type="checkbox" id="editVip"> VIP kurum</label>
          <label><input type="checkbox" id="editVideo"> Videolu</label>
          <label><input type="checkbox" id="editOffer"> Teklif veriyor</label>
        </div>

        <button type="submit" class="save-btn">Değişiklikleri Kaydet</button>
      </form>
    </div>
  </div>

  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script src="admin.js?v=10"></script>

</body>
</html>
